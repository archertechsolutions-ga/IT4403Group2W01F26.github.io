services:
  - type: web
    name: curtaincall-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MONGODB_DB_NAME
        value: curtaincall
      - key: CORS_ORIGINS
        value: https://archertechsolutions-ga.github.io
      - key: MONGODB_URI
        sync: false
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false

